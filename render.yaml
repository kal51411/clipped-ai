services:
  - type: web
    name: clipped-ai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SHOW_DOCS
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./clipped_ai.db
      - key: DATABASE_SYNC_URL
        value: sqlite:///./clipped_ai.db
